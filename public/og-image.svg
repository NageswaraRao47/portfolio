  <text x="130" y="127" fill="#c7d2fe" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" letter-spacing="1.5">AI ENGINEER &amp; TECHNOLOGY TRAINER</text>

  <!-- Title -->
  <text x="100" y="240" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="800">G. NAGESWARA RAO</text>
  <text x="100" y="320" fill="url(#textGrad)" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700">Turning Complex Technologies Into Practical Skills.</text>

  <!-- Subtitle -->
  <text x="100" y="380" fill="#94a3b8" font-family="sans-serif" font-size="22">BRAIN O VISION – EdTech • Generative AI &amp; Agentic Workflows • Python</text>

  <!-- Highlights -->
  <rect x="100" y="440" width="300" height="80" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="130" y="475" fill="#22d3ee" font-family="sans-serif" font-size="28" font-weight="700">10 Colleges</text>
  <text x="130" y="500" fill="#94a3b8" font-family="sans-serif" font-size="14">Independent Workshop Delivery</text>

  <rect x="430" y="440" width="300" height="80" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="460" y="475" fill="#a855f7" font-family="sans-serif" font-size="28" font-weight="700">GenAI &amp; Agentic</text>
  <text x="460" y="500" fill="#94a3b8" font-family="sans-serif" font-size="14">LangChain, CrewAI &amp; Models</text>
